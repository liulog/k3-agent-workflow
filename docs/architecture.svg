        <rect x="0" y="0" width="1280" height="800" fill="#ffffff" stroke="none" /><text  x="640.0" y="40" font-family="Arial, sans-serif" font-size="24" fill="#000000" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal" >K3 Agent Workflow</text><text  x="640.0" y="78" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Asynchronous orchestration for Pi — hardware-free MVP</text><rect  x="40.0" y="160" width="360.0" height="170" rx="10" ry="5" fill="#D1E6F1" stroke="#0072B2" stroke-width="1" fill-opacity="1" data-node-id="main"  /><text  x="220.0" y="194" font-family="Arial, sans-serif" font-size="18" fill="#000000" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal" >Pi Main Agent / Astra</text><text  x="220.0" y="236" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >workflow extension</text><text  x="220.0" y="262" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Submit • inspect • cancel</text><text  x="220.0" y="288" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Completion → follow-up</text><rect  x="460.0" y="160" width="360.0" height="170" rx="10" ry="5" fill="#FAEED1" stroke="#E69F00" stroke-width="1" fill-opacity="1" data-node-id="daemon"  /><text  x="640.0" y="194" font-family="Arial, sans-serif" font-size="18" fill="#000000" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal" >workflowd / TypeScript</text><text  x="640.0" y="236" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Authenticated local HTTP</text><text  x="640.0" y="262" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Queue • budget • idempotency</text><text  x="640.0" y="288" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Validate results before success</text><rect  x="880.0" y="160" width="360.0" height="170" rx="10" ry="5" fill="#D1EEE6" stroke="#009E73" stroke-width="1" fill-opacity="1" data-node-id="worker"  /><text  x="1060.0" y="194" font-family="Arial, sans-serif" font-size="18" fill="#000000" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal" >Build / Test Workers</text><text  x="1060.0" y="236" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Default: deterministic demo</text><text  x="1060.0" y="262" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Optional: Pi RPC / Luna</text><text  x="1060.0" y="288" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Fresh process for each RPC job</text><rect  x="460.0" y="480" width="360.0" height="170" rx="10" ry="5" fill="#FAEED1" stroke="#E69F00" stroke-width="1" fill-opacity="1" data-node-id="storage"  /><text  x="640.0" y="514" font-family="Arial, sans-serif" font-size="18" fill="#000000" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal" >Durable state &amp; artifacts</text><text  x="640.0" y="556" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >SQLite tasks + replayable events</text><text  x="640.0" y="582" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Source snapshot + SHA-256</text><text  x="640.0" y="608" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Stage results + RPC logs</text><rect  x="880.0" y="480" width="360.0" height="170" rx="10" ry="5" fill="#D1EEE6" stroke="#009E73" stroke-width="1" fill-opacity="1" data-node-id="pipeline"  /><text  x="1060.0" y="514" font-family="Arial, sans-serif" font-size="18" fill="#000000" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal" >Build → test</text><text  x="1060.0" y="556" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Test waits for validated artifact</text><text  x="1060.0" y="582" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >One slot per stage</text><text  x="1060.0" y="608" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >SIMULATED results only</text><line x1="400.0" y1="238.0" x2="458.5" y2="238.0" stroke="#4D4D4D" stroke-width="1.5" marker-end="url(#arrowhead)"  /><line x1="820.0" y1="245.0" x2="878.5" y2="245.0" stroke="#4D4D4D" stroke-width="1.5" marker-end="url(#arrowhead)"  /><line x1="640.0" y1="330" x2="640.0" y2="478.5" stroke="#4D4D4D" stroke-width="1.5" marker-end="url(#arrowhead)"  /><line x1="1060.0" y1="330" x2="1060.0" y2="478.5" stroke="#4D4D4D" stroke-width="1.5" marker-end="url(#arrowhead)"  /><line x1="460.0" y1="252.0" x2="401.5" y2="252.0" stroke="#4D4D4D" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="6,3" /><text  x="430.0" y="136" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >HTTP</text><text  x="850.0" y="136" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >JSONL</text><text  x="220.0" y="510" font-family="Arial, sans-serif" font-size="18" fill="#000000" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal" >Completion channel: SSE</text><text  x="220.0" y="552" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Replay cursor • reconnect • deduplicate</text><text  x="220.0" y="588" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Auto continuation is OFF by default</text><text  x="640.0" y="724" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Solid: task / state flow     Dashed: asynchronous completion notification</text><text  x="640.0" y="762" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Future board adapter: SSH / serial + explicit authorization + safe recovery. NOT implemented in this MVP.</text>
