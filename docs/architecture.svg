        <rect x="0" y="0" width="1440" height="1240" fill="#ffffff" stroke="none" /><text  x="720.0" y="40" font-family="Arial, sans-serif" font-size="28" fill="#000000" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal" >Three agents, one deterministic coordinator</text><text  x="720.0" y="82" font-family="Arial, sans-serif" font-size="18" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >RPC demo topology • all processes run on the host • results are SIMULATED</text><rect  x="40.0" y="140" width="340" height="180" rx="10" ry="5" fill="#D1E6F1" stroke="#0072B2" stroke-width="1" fill-opacity="1" data-node-id="main"  /><text  x="210.0" y="172" font-family="Arial, sans-serif" font-size="22" fill="#000000" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal" >Main Agent · Astra</text><text  x="210.0" y="212" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Propose / edit assembly candidates</text><text  x="210.0" y="241" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Read results; decide the next experiment</text><text  x="210.0" y="270" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Interactive Pi session</text><rect  x="40.0" y="460" width="340" height="220" rx="10" ry="5" fill="#D1E6F1" stroke="#0072B2" stroke-width="1" fill-opacity="1" data-node-id="extension"  /><text  x="210.0" y="492" font-family="Arial, sans-serif" font-size="22" fill="#000000" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal" >workflow extension</text><text  x="210.0" y="532" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >INSIDE the main Pi process</text><text  x="210.0" y="561" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >workflow_submit / result / status / cancel</text><text  x="210.0" y="590" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >HTTP client + background SSE listener</text><text  x="210.0" y="619" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Not a fourth agent</text><rect  x="550.0" y="200" width="340" height="580" rx="10" ry="5" fill="#FAEED1" stroke="#E69F00" stroke-width="1" fill-opacity="1" data-node-id="daemon"  /><text  x="720.0" y="232" font-family="Arial, sans-serif" font-size="22" fill="#000000" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal" >workflowd</text><text  x="720.0" y="272" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >TypeScript service — NOT an LLM</text><text  x="720.0" y="330" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Accept + snapshot candidate bytes</text><text  x="720.0" y="359" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Persist task and event in SQLite</text><text  x="720.0" y="417" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Dispatch BUILD (one slot)</text><text  x="720.0" y="446" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Validate artifact + source SHA-256</text><text  x="720.0" y="475" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Dispatch TEST (one slot)</text><text  x="720.0" y="504" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Validate metrics + artifact identity</text><text  x="720.0" y="562" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Persist terminal state → publish event</text><text  x="720.0" y="591" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Never trust &#x27;done&#x27; text alone</text><rect  x="1060.0" y="160" width="340" height="230" rx="10" ry="5" fill="#D1EEE6" stroke="#009E73" stroke-width="1" fill-opacity="1" data-node-id="build"  /><text  x="1230.0" y="192" font-family="Arial, sans-serif" font-size="22" fill="#000000" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal" >Build Agent · Luna</text><text  x="1230.0" y="232" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Independent Pi RPC child / build job</text><text  x="1230.0" y="261" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Reads candidate.s</text><text  x="1230.0" y="290" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Writes artifact.txt + result.json</text><text  x="1230.0" y="319" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Demo only: NO compiler</text><rect  x="1060.0" y="540" width="340" height="230" rx="10" ry="5" fill="#D1EEE6" stroke="#009E73" stroke-width="1" fill-opacity="1" data-node-id="test"  /><text  x="1230.0" y="572" font-family="Arial, sans-serif" font-size="22" fill="#000000" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal" >Test Agent · Luna</text><text  x="1230.0" y="612" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Independent Pi RPC child / test job</text><text  x="1230.0" y="641" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Reads registered artifact path + hash</text><text  x="1230.0" y="670" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Writes test/result.json</text><text  x="1230.0" y="699" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Demo only: synthetic samples</text><rect  x="550.0" y="930" width="340" height="170" rx="10" ry="5" fill="#FAEED1" stroke="#E69F00" stroke-width="1" fill-opacity="1" data-node-id="storage"  /><text  x="720.0" y="962" font-family="Arial, sans-serif" font-size="22" fill="#000000" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal" >Durable experiment data</text><text  x="720.0" y="1002" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >SQLite: states, budget, replayable events</text><text  x="720.0" y="1031" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Files: source, artifacts, logs, results</text><text  x="720.0" y="1060" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Worker-to-worker handoff = path + hash</text><rect  x="1060.0" y="930" width="340" height="170" rx="10" ry="5" fill="#D1EEE6" stroke="#009E73" stroke-width="1" fill-opacity="1" data-node-id="future" stroke-dasharray="2,5" /><text  x="1230.0" y="962" font-family="Arial, sans-serif" font-size="22" fill="#000000" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal" >FUTURE ONLY · k3-auto</text><text  x="1230.0" y="1002" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >integrations/k3-auto submodule</text><text  x="1230.0" y="1031" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Skills → SSH / serial → board benchmark</text><text  x="1230.0" y="1060" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Not loaded; no board access today</text><line x1="105.0" y1="320" x2="105.0" y2="460" stroke="#4D4D4D" stroke-width="1.5" marker-end="url(#arrowhead)"  /><text  x="205.0" y="362" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >tool call ↓</text><line x1="335.0" y1="460" x2="335.0" y2="320" stroke="#4D4D4D" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="6,3" /><text  x="205.0" y="414" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >↑ sendMessage</text><line x1="380.0" y1="505" x2="550.0" y2="505" stroke="#4D4D4D" stroke-width="1.5" marker-end="url(#arrowhead)"  /><text  x="465.0" y="485" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >HTTP POST + JSON</text><line x1="550.0" y1="570" x2="380.0" y2="570" stroke="#4D4D4D" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="6,3" /><text  x="465.0" y="549" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >HTTP 202 + exp ID</text><line x1="550.0" y1="645" x2="380.0" y2="645" stroke="#4D4D4D" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="6,3" /><text  x="465.0" y="624" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >SSE: event JSON</text><line x1="890.0" y1="250" x2="1060.0" y2="250" stroke="#4D4D4D" stroke-width="1.5" marker-end="url(#arrowhead)"  /><text  x="975.0" y="229" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >RPC stdin: prompt</text><line x1="1060.0" y1="334" x2="890.0" y2="334" stroke="#4D4D4D" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="6,3" /><text  x="975.0" y="312" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >stdout: JSONL</text><line x1="890.0" y1="630" x2="1060.0" y2="630" stroke="#4D4D4D" stroke-width="1.5" marker-end="url(#arrowhead)"  /><text  x="975.0" y="609" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >RPC stdin: prompt</text><line x1="1060.0" y1="714" x2="890.0" y2="714" stroke="#4D4D4D" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="6,3" /><text  x="975.0" y="692" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >stdout: JSONL</text><line x1="720.0" y1="780" x2="720.0" y2="930" stroke="#4D4D4D" stroke-width="1.5" marker-end="url(#arrowhead)"  /><text  x="635.0" y="855" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >state + files</text><line x1="1230.0" y1="770" x2="1230.0" y2="930" stroke="#4D4D4D" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="2,5" /><text  x="1143.0" y="855" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >future adapter</text><text  x="40.0" y="775" font-family="Arial, sans-serif" font-size="22" fill="#000000" text-anchor="start" dominant-baseline="central" font-weight="bold" font-style="normal" >No direct agent-to-agent chat</text><text  x="40.0" y="815" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >Astra delegates through registered tools.</text><text  x="40.0" y="846" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >Only workflowd starts worker processes.</text><text  x="40.0" y="877" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >Build never calls Test directly.</text><text  x="40.0" y="908" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >Test starts only after artifact validation.</text><text  x="40.0" y="939" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >Fresh Pi context for each RPC stage.</text><text  x="40.0" y="970" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >Default mode replaces both Luna agents</text><text  x="40.0" y="1001" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >with deterministic in-process demo workers.</text><text  x="720.0" y="1145" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Solid = request / state flow     Dashed = response / event     Dotted = future integration</text><text  x="720.0" y="1182" font-family="Arial, sans-serif" font-size="18" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal" >Control: tools + HTTP/SSE + Pi RPC     Data: local files + SHA-256     Persistence: SQLite</text>
        </svg>